      Family: {source_text: "gia dinh 2", evidence_kind: explicit_numeric, normalized_from: "2", language: vi}
      CCAvg: {source_text: "chi tieu the 2.0 moi thang", evidence_kind: explicit_numeric, normalized_from: "2.0", language: vi}

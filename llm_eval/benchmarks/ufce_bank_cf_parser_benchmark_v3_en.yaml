      CCAvg: {source_text: "CCAvg 4.8", evidence_kind: explicit_numeric, normalized_from: "4.8", language: en}
      Education: {source_text: "Education 2", evidence_kind: explicit_numeric, normalized_from: "2", language: en}
      Mortgage: {source_text: "Mortgage 200", evidence_kind: explicit_numeric, normalized_from: "200", language: en}
      CDAccount: {source_text: "CDAccount yes", evidence_kind: explicit_boolean, normalized_from: "yes", language: en}

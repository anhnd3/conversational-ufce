name: Create v1.1.1 Release

on:
  push:
    paths:
      - .github/workflows/create-v1.1.1-release.yml

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create or update release
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = 'v1.1.1';
            const target = '56e45370c1eb5ce634dbfa06ffc9264c19c7a08f';
            const name = 'v1.1.1 - Final_v7.6 evidence alignment';
            const body = `Final_v7.6 evidence-alignment release for thesis appendix citation.

Locked references:
- Tag: v1.1.1
- Commit: 56e45370c1eb5ce634dbfa06ffc9264c19c7a08f
- Target thesis: Final_v7.6
- PDF export timestamp: 2026-07-12T16:49:19+07:00

Release contents:
- Adds \`outputs/final/thesis_canonical/summary.json\` as the compact canonical thesis-final summary.
- Aligns \`README.md\`, \`docs/FINAL_RUNBOOK.md\`, \`docs/THESIS_TABLE_TO_SCRIPT_MAP.md\`, and \`docs/FINAL_CLAIM_TO_EVIDENCE_MAP.md\` with the Final_v7.6 headline counts.
- Locks Bank Loan Route 2 headline counts:
  - Direct UFCE-FF comparator: 80 / 44 / 26
  - After natural-language handoff: 79 / 44 / 26
  - Parser gate: 250 source cases, 247 runtime-ready, 243 accepted, 7 dropped.

Notes:
- Earlier local Route 2 snapshots that report UFCE-FF2=43 or UFCE-FF3=27 are historical/non-canonical for Final_v7.6 headline claims.
- This release is intended as the source-code release to cite from the thesis appendices.
`;
            try {
              await github.rest.repos.createRelease({
                owner, repo,
                tag_name: tag,
                target_commitish: target,
                name,
                body,
                draft: false,
                prerelease: false,
                make_latest: 'true'
              });
              core.info(`Created release ${tag}`);
            } catch (error) {
              if (error.status !== 422) throw error;
              const current = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              await github.rest.repos.updateRelease({
                owner, repo,
                release_id: current.data.id,
                tag_name: tag,
                target_commitish: target,
                name,
                body,
                draft: false,
                prerelease: false,
                make_latest: 'true'
              });
              core.info(`Updated existing release ${tag}`);
            }
